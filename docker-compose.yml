services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deal_finder
      POSTGRES_USER: deal_finder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_finder -d deal_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["server"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deal_finder:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/deal_finder?schema=public
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ""
      SCHEDULER_ENABLED: "true"
      VNC_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.runtime:/app/.runtime
    ports:
      - "127.0.0.1:${VNC_PORT:-5900}:5900"
    shm_size: "1gb"
    init: true

volumes:
  postgres_data:
